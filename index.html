<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c3460"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Frozen Products Order</title>
<style>
:root{--bg:#eef7fb;--card:#fff;--tx:#12263a;--mu:#5d7083;--pr:#0c3460;--hd:#0c3460;--ac:#dc2828;--ok:#16794a;--bd:#d5e3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1722;--card:#15232f;--tx:#e8f0f6;--mu:#9bb0c0;--pr:#7db4ee;--hd:#10263a;--ac:#ff6b6b;--ok:#2f9e6a;--bd:#274052}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1722;--card:#15232f;--tx:#e8f0f6;--mu:#9bb0c0;--pr:#7db4ee;--hd:#10263a;--ac:#ff6b6b;--ok:#2f9e6a;--bd:#274052}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);color:#fff;z-index:5}
header nav{display:flex;flex-wrap:wrap;gap:2px}
nav button{background:none;border:0;color:#fff;font:inherit;padding:6px 8px;cursor:pointer}
.wrap{max-width:1000px;margin:auto;padding:12px 14px}
.narrow{max-width:420px;margin:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.card img{width:100%;aspect-ratio:3/4;object-fit:contain}
.mu{color:var(--mu);font-size:14px}.pr{color:var(--ac);font-weight:800}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.b.g{background:transparent;color:var(--pr);border:1px solid var(--bd)}.b:disabled{opacity:.45}
.card>.b{width:100%}a.b{text-decoration:none;display:inline-block}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mu)}
label.opt{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:16px}.opt input{width:auto}
.tag{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.t-Pending{background:#f2b705;color:#222}.t-Preparing{background:#2f7de1;color:#fff}.t-Delivering{background:#8a4fd8;color:#fff}.t-Success{background:var(--ok);color:#fff}.t-Cancelled{background:#777;color:#fff}
.steps{display:flex;gap:4px;margin:8px 0}.steps span{flex:1;text-align:center;font-size:12px;padding:4px 2px;border-radius:6px;background:var(--bd);color:var(--mu)}.steps .on{background:var(--ok);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}.chips .b{padding:5px 10px;font-size:14px}
.demo{background:#fff6d6;color:#4a3b00;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
a{color:var(--pr)}
#ld{display:none;position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:30;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-weight:600;text-align:center;padding:20px}
.sp{width:44px;height:44px;border:5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#12263a;color:#fff;padding:10px 16px;border-radius:10px;max-width:90%;z-index:20}
</style></head>

async function hs(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent(s)))}}

function place(){const u=U().find(x=>x.u===me);if(!u)return go("login");const g=i=>$("#"+i).value.trim();const name=g("cn"),mobile=g("cm"),addr=g("ca"),pay=document.querySelector("input[name=pay]:checked").value;
